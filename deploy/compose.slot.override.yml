# Per-slot override generated by scripts/csmon-deploy.sh — do not edit by hand.
# Merged with docker-compose.yml for production or pre-production containers.

services:
  csmon:
    ports:
      - "${CSMON_SLOT_BIND}:${CSMON_SLOT_PORT}:3000"
    environment:
      PORT: "3000"
      CSMON_BIND_HOST: "0.0.0.0"
      CSMON_DATA_DIR: /app/data
    volumes:
      - ${CSMON_SLOT_DATA_MOUNT}:/app/data
